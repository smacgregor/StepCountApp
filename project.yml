name: StepCountApp

options:
  bundleIdPrefix: com.bigmacsoftware
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
#  createIntermediateGroups: true
#  automaticSchemes: true
settings:
   base:
     DEVELOPMENT_TEAM: HEY2QHJ383
     CODE_SIGN_STYLE: Automatic
     SWIFT_VERSION: "5.0"
     MARKETING_VERSION: "1.0"
     CURRENT_PROJECT_VERSION: "1"

targets:
  # iOS packaging container. No app UI or Swift source code
  StepCountApp:
    type: application.watchapp2-container
    platform: iOS
    sources: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigmacsoftware.StepCountApp
        PRODUCT_NAME: StepCountApp
        SKIP_INSTALL: NO
        TARGETED_DEVICE_FAMILY: "1" 
    dependencies:
      - target: StepCountWatchApp

  # Modern Single-Target watchOS App
  StepCountWatchApp:
    type: application 
    platform: watchOS
    deploymentTarget: "27.0"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bigmacsoftware.StepCountApp.watchkitapp 
        PRODUCT_NAME: StepCountWatchApp
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "We need access to read your step data to display it on your watch face."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "We need access to read your step data to display it on your watch face."
    sources:
      - path: Shared/
      - path: StepCountApp/
      - path: Assets.xcassets
    dependencies:
      - target: StepCountWidgetExtension
    entitlements:
      path: StepCountApp/StepCountApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true

  StepCountWidgetExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "27.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: StepCountWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.bigmacsoftware.StepCountApp.watchkitapp.StepCountWidgetExtension
        INFOPLIST_KEY_CFBundleDisplayName: "StepCount" 
    sources:
      - path: Shared/
      - path: StepCountWidgetExtension/
    info:
      path: Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StepCountWidgetExtension/StepCountWidgetExtension.entitlements
      properties:
        com.apple.developer.healthkit: true
