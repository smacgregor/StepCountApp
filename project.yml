name: StepCountApp
targets:
  # Modern Single-Target watchOS App
  StepCountApp:
    type: application
    platform: watchOS
    deploymentTarget: "27.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.StepCountApp
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SUPPORTS_MACCATALYST: false
        WATCHOS_DEPLOYMENT_TARGET: 27.0
        ENABLE_PREVIEWS: true
        INFOPLIST_KEY_NSHealthShareUsageDescription: "This app accesses your step count data to display it in the watch face."
    sources:
      - path: Shared/
      - path: StepCountApp/
    dependencies:
      - target: StepCountWidgetExtension
        embed: true
    info:
      path: StepCountApp/Info.plist
      properties:
        NSHealthShareUsageDescription: "This app accesses your step count data to display it in the watch face."
        CFBundleDisplayName: StepCountApp

  StepCountWidgetExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "27.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.StepCountApp.StepCountWidgetExtension
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        WATCHOS_DEPLOYMENT_TARGET: 27.0
        INFOPLIST_KEY_NSHealthShareUsageDescription: "This app accesses your step count data to display it in the watch face."
        INFOPLIST_KEY_CFBundleIdentifier: com.personal.StepCountApp.StepCountWidgetExtension 
    sources:
      - path: Shared/
      - path: StepCountWidgetExtension/
    info:
      path: StepCountWidgetExtension/Info.plist
      properties:
        NSHealthShareUsageDescription: "This app accesses your step count data to display it in the watch face."
        CFBundleDisplayName: StepCountWidgetExtension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
          NSExtensionAttributes:
            WidgetFamily:
              - accessoryCircular
